# PHVE deployment stack: Streamlit + Cloudflare Tunnel.
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Required env vars (in deploy/.env):
#   CF_TUNNEL_TOKEN -- token from Cloudflare Zero Trust dashboard
#                      (Networks > Tunnels > <your tunnel> > Connectors).

services:
  streamlit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: phve-streamlit:latest
    container_name: phve-streamlit
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - phve
    volumes:
      - nilearn_cache:/data/nilearn_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: phve-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - phve
    depends_on:
      streamlit:
        condition: service_healthy

networks:
  phve:
    name: phve_network
    driver: bridge

volumes:
  nilearn_cache:
    name: phve_nilearn_cache
