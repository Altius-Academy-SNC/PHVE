# PHVE Streamlit demonstrator.
#
# This compose file runs only the application container, bound to
# 127.0.0.1:8501 on the host. SSL termination and routing for
# phve.names.legal are expected to be handled by the host's nginx +
# certbot (see deploy/DEPLOY.md).
#
# From the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  streamlit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: phve-streamlit:latest
    container_name: phve-streamlit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - nilearn_cache:/data/nilearn_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  nilearn_cache:
    name: phve_nilearn_cache
