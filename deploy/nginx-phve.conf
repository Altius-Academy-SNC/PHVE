# Nginx server blocks for phve.names.legal.
#
# Append this snippet inside /etc/nginx/sites-available/default
# (or wherever the host's nginx aggregates virtual hosts).
#
# After the first deployment, run:
#   certbot --nginx -d phve.names.legal
# certbot will inject `listen 443 ssl` directives + ssl_certificate
# paths and create the cert under /etc/letsencrypt/live/phve.names.legal/.
#
# Streamlit needs WebSocket upgrade on the same path; that's what the
# `Upgrade`/`Connection` headers and `proxy_http_version 1.1` are for.

server {
    listen 80;
    listen [::]:80;
    server_name phve.names.legal;

    # certbot uses /.well-known/acme-challenge/ over HTTP-01.
    # Once the cert is in place, certbot will rewrite this to a
    # 301 -> https redirect.

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (Streamlit live updates use it)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
